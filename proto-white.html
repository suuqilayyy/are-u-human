<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage 1 · White</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#8e9399;font-family:Inter,sans-serif;color:#111;-webkit-font-smoothing:antialiased}
.bar{display:flex;justify-content:center;gap:10px;padding:16px 16px 0;color:#fff;font-size:12px}
.bar button{border:1px solid rgba(255,255,255,.6);background:none;color:#fff;border-radius:99px;padding:5px 12px;font:500 12px Inter,sans-serif;cursor:pointer}
.row{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;padding:18px 16px 28px}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:340px}
.cap{color:#fff;font-size:12px;line-height:1.5;text-align:center}
.cap b{font-weight:600}
.ph{width:340px;height:680px;background:#fff;border-radius:6px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;padding:22px 24px}
.top{width:100%;display:flex;justify-content:space-between;font-size:10px;color:#b0b0b0;letter-spacing:.02em}

.view{position:relative;margin-top:60px;flex:none}
.ring{position:absolute;inset:0;overflow:visible}
.ring line{stroke:#e6e6e6;stroke-linecap:butt}
.ring line.on{stroke:#111}
.lens{position:absolute;border-radius:50%;overflow:hidden;background:#cfcfcf}
.lens video,.lens .fake{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.fake{background:radial-gradient(ellipse 34% 42% at 50% 46%,#d9d9d9 0 60%,transparent 62%),radial-gradient(ellipse 60% 40% at 50% 105%,#bdbdbd 0 70%,transparent 72%),linear-gradient(#e9e9e9,#a9a9a9)}
.lens.mono video,.lens.mono .fake{filter:grayscale(1) contrast(1.1)}
.lens.vig::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px #111}
.count{position:absolute;inset:0;display:grid;place-items:center;font-weight:200;color:#fff;font-variant-numeric:tabular-nums;opacity:0;transform:translateY(6px)}
.count.on{opacity:1;transform:none;transition:opacity .35s cubic-bezier(.05,.7,.1,1),transform .35s cubic-bezier(.05,.7,.1,1)}
.count.off{opacity:0;transition:opacity .2s cubic-bezier(.3,0,.8,.15)}

.msg{width:100%;text-align:center}
.step{display:none}
.line{font-weight:500;color:#111;transition:opacity .25s,transform .35s cubic-bezier(.05,.7,.1,1)}
.sub{color:#8a8a8a;line-height:1.5;transition:opacity .25s .08s,transform .35s .08s cubic-bezier(.05,.7,.1,1)}
.msg.swap .line,.msg.swap .sub{opacity:0;transform:translateY(5px);transition:opacity .15s,transform .15s}

.axis{position:relative;height:34px;margin:22px auto 0;opacity:0}
.axis.on{opacity:1}
.axis .ln{position:absolute;top:14px;left:0;right:0;height:1px;background:#111;transform:scaleX(0);transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.axis.on .ln{transform:scaleX(1)}
.axis .hb{position:absolute;top:12px;height:5px;background:#111;transform:scaleX(0);transition:transform .45s .25s cubic-bezier(.2,.7,.1,1)}
.axis.on .hb{transform:scaleX(1)}
.axis .me{position:absolute;top:11px;width:7px;height:7px;border-radius:50%;background:#111;transform:translateX(-50%) scale(0);transition:transform .3s .55s cubic-bezier(.2,.7,.1,1)}
.axis.on .me{transform:translateX(-50%) scale(1)}
.axis .lb{position:absolute;top:22px;font-size:10px;color:#8a8a8a;white-space:nowrap;transform:translateX(-50%);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s .7s}
.axis.on .lb{opacity:1}
.foot{margin-top:auto;font-size:10px;color:#c0c0c0}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:no-preference){.view.shake{animation:shake .4s ease-out}}
.stag{opacity:0;transform:translateY(6px);transition:opacity .4s cubic-bezier(.05,.7,.1,1),transform .4s cubic-bezier(.05,.7,.1,1)}
.stag.in{opacity:1;transform:none}

/* ---- A · 加四条 ---- */
.A .line{font-size:44px;letter-spacing:-.035em;line-height:1.04}
.A .sub{font-size:12px;margin-top:12px}
.A .msg{margin-top:38px}

/* ---- B · 仪器 ---- */
.B .line{font-size:38px;letter-spacing:-.03em;line-height:1.05}
.B .sub{font-size:12px;margin-top:10px}
.B .msg{margin-top:30px}
.B .data{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:22px;border-top:1px solid #111}
.B .data div{padding-top:6px;font-size:9px;color:#9a9a9a;text-align:left}
.B .data b{display:block;font-weight:400;font-size:18px;color:#111;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}

/* ---- C · 大字 ---- */
.C{align-items:flex-start}
.C .view{margin-top:26px}
.C .msg{text-align:left;margin-top:auto}
.C .line{font-size:58px;letter-spacing:-.045em;line-height:.98}
.C .sub{font-size:12px;margin-top:14px;max-width:85%}
.C .axis{margin:20px 0 0}
.C .foot{margin-top:24px}

/* choreography */
.ring{transition:opacity .25s ease-out}
.ring.dim{opacity:0}
.ring.think{animation:think .9s ease-in-out infinite}
@keyframes think{50%{opacity:.35}}
.lens .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.lens .flash.go{animation:flash .22s ease-out}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
.B .data b{transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.B .data b.bump{transform:translateY(-2px)}
.ph{transition:opacity .4s ease}
.ph.out{opacity:0}
</style>
</head>
<body>
<div class="bar"><span id="camst">正在打开摄像头…</span><button id="cam" type="button" hidden>重试摄像头</button><button id="replay" type="button">重播</button></div>
<div class="row">
  <div class="col"><div class="ph A" data-v="A"></div><div class="cap"><b>A · 照调研加四条</b><br>主句 44px 拉开层级、失败轻摇、错开出场</div></div>
  <div class="col"><div class="ph B" data-v="B"></div><div class="cap"><b>B · 仪器</b><br>120 根细刻度，像表盘；底下一排读数，系统一直在记录你</div></div>
  <div class="col"><div class="ph C" data-v="C"></div><div class="cap"><b>C · 大字</b><br>取景框缩小靠左，一句话占半屏，判定像宣告</div></div>
</div>
<script>
const CFG={
  A:{size:220,lens:.8,ticks:72,tw:2,tl:9,count:96},
  B:{size:236,lens:.78,ticks:120,tw:1,tl:12,count:84,data:true},
  C:{size:150,lens:.8,ticks:60,tw:1.5,tl:8,count:64}
};
let stream=null;
function build(ph){
  const c=CFG[ph.dataset.v],S=c.size,L=S*c.lens,off=(S-L)/2,r2=S/2,r1=r2-c.tl;
  const lines=Array.from({length:c.ticks},(_,i)=>{const a=-Math.PI/2+i/c.ticks*2*Math.PI;
    return `<line x1="${r2+r1*Math.cos(a)}" y1="${r2+r1*Math.sin(a)}" x2="${r2+r2*Math.cos(a)}" y2="${r2+r2*Math.sin(a)}" stroke-width="${c.tw}"/>`}).join('');
  ph.innerHTML=`
  <div class="view stag" style="width:${S}px;height:${S}px"><svg class="ring" viewBox="0 0 ${S} ${S}">${lines}</svg>
    <div class="lens vig" style="left:${off}px;top:${off}px;width:${L}px;height:${L}px">${stream?'<video autoplay muted playsinline></video>':'<div class="fake"></div>'}<div class="count" style="font-size:${c.count}px"></div></div></div>
  <div class="msg"><div class="step stag"></div><div class="line"></div><div class="sub"></div>
    <div class="axis" style="width:${ph.dataset.v==='C'?'100%':'86%'}"><div class="ln"></div><div class="hb"></div><div class="me"></div><div class="lb"></div></div></div>
  ${c.data?'<div class="data stag"><div>Blinks<b class="d1">0</b></div><div>Interval<b class="d2">–</b></div><div>Human<b class="d3">–</b></div></div>':''}
  <div class="foot"></div>`;
  if(stream){const v=ph.querySelector('video');v.srcObject=stream;v.play().catch(()=>{});}
  return {ph,c,ticks:[...ph.querySelectorAll('.ring line')]};
}
const q=(p,s)=>p.querySelector(s);
const wait=ms=>new Promise(r=>{timers.push(setTimeout(r,ms))});
const ease=t=>1-Math.pow(1-t,3);
let timers=[],raf=0,all=[],run_id=0;

// one line of text at a time: old text leaves (150ms), new headline enters, the sub follows 120ms later
async function say(line,sub){
  all.forEach(o=>q(o.ph,'.msg').classList.add('swap'));await wait(160);
  all.forEach(o=>{q(o.ph,'.line').textContent=line;q(o.ph,'.sub').textContent=sub||'';q(o.ph,'.msg').classList.remove('swap');});
  await wait(sub?420:300);
}
function fillAll(frac){all.forEach(o=>{const n=Math.round(frac*o.ticks.length);o.ticks.forEach((t,i)=>t.classList.toggle('on',i<n));});}
function sweep(dur,curve){return new Promise(res=>{const t0=performance.now();cancelAnimationFrame(raf);
  const f=now=>{const k=Math.min(1,(now-t0)/dur);fillAll(curve?curve(k):k);if(k<1)raf=requestAnimationFrame(f);else res();};raf=requestAnimationFrame(f);});}
async function resetRing(){all.forEach(o=>q(o.ph,'.ring').classList.add('dim'));await wait(260);fillAll(0);all.forEach(o=>q(o.ph,'.ring').classList.remove('dim'));await wait(120);}
async function countdown(){
  for(const n of [3,2,1]){all.forEach(o=>{const c=q(o.ph,'.count');c.className='count';c.textContent=n;void c.offsetWidth;c.classList.add('on');});await wait(820);}
  all.forEach(o=>q(o.ph,'.count').classList.add('off'));await wait(220);
}
function axis(rate){all.forEach(o=>{const a=q(o.ph,'.axis');if(rate==null){a.classList.remove('on');return;}const x=v=>Math.max(2,Math.min(98,v/60*100));
  q(a,'.hb').style.cssText=`left:${x(12)}%;width:${x(22)-x(12)}%`;q(a,'.me').style.left=x(rate)+'%';const lb=q(a,'.lb');lb.style.cssText='left:auto;right:0;transform:none';lb.textContent=`You · ${rate} / min`;a.classList.add('on');});}
function data(k,iv,h){all.forEach(o=>{const set=(c,v)=>{const b=q(o.ph,c);if(!b||v==null)return;b.textContent=v;b.classList.add('bump');setTimeout(()=>b.classList.remove('bump'),200);};set('.d1',k);set('.d2',iv);set('.d3',h);});}

// measuring: the ring is a 4-second clock; each blink flashes the lens like a shutter
async function measure(blinkAt){
  data(0,'–','–');let k=0;
  blinkAt.forEach(t=>timers.push(setTimeout(()=>{k++;all.forEach(o=>{const f=q(o.ph,'.flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');});data(k,k>1?(t/1000/(k)).toFixed(2)+' s':null);},t)));
  await sweep(4000);
  // a beat of "thinking" before any verdict: the text clears and the ring breathes
  all.forEach(o=>q(o.ph,'.msg').classList.add('swap'));all.forEach(o=>q(o.ph,'.ring').classList.add('think'));
  await wait(1100);
  all.forEach(o=>q(o.ph,'.ring').classList.remove('think'));
}
async function attempt(intro,blinks){
  await say(intro,'');await wait(700);
  await resetRing();await countdown();
  await measure(blinks);
}
function shake(){all.forEach(o=>{const v=q(o.ph,'.view');v.classList.remove('shake');void v.offsetWidth;v.classList.add('shake');});}

async function play(id){
  // entrance: the camera first, the words after
  all.forEach(o=>{o.ph.classList.remove('out');q(o.ph,'.line').textContent='';q(o.ph,'.sub').textContent='';o.ph.querySelectorAll('.stag').forEach(e=>e.classList.remove('in'));});
  fillAll(0);axis(null);data(0,'–','–');
  await wait(200);all.forEach(o=>o.ph.querySelectorAll('.stag').forEach((e,i)=>setTimeout(()=>e.classList.add('in'),i*90)));
  await wait(350);await say('Look at the camera.','');
  await wait(1500);
  // face found: the ring closes around you, then it speaks
  await sweep(900,ease);await wait(150);
  await say('I see you.','');await wait(1100);
  if(id!==run_id)return;
  await attempt('Blink normally.',[700,1700,2600]);
  shake();await say('Too fast.','3 blinks in 4 seconds. That’s 45 a minute. Humans blink about 17 times a minute at rest.');
  data(null,null,'17 / min');axis(45);await wait(4200);
  axis(null);await wait(300);
  if(id!==run_id)return;
  await attempt('Try again.',[900,2300]);
  shake();await say('Your blinks were deliberate.','Humans don’t think about blinking.');await wait(3200);
  if(id!==run_id)return;
  await attempt('One more time.',[1300]);
  await say('Now that’s human.','You stopped trying.');await wait(3800);
  if(id!==run_id)return;
  all.forEach(o=>o.ph.classList.add('out'));await wait(500);
  run();
}
function run(){
  timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);run_id++;
  all=[...document.querySelectorAll('.ph')].map(build);
  all.forEach(o=>{const l=q(o.ph,'.lens');l.insertAdjacentHTML('beforeend','<div class="flash"></div>');});
  play(run_id);
}
document.getElementById('replay').onclick=run;
async function cam(){const st=document.getElementById('camst'),b=document.getElementById('cam');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});st.textContent='三版自动循环播放，取景框里是你自己。';b.hidden=true;run();}catch(e){st.textContent='摄像头被挡住了，请在地址栏允许摄像头后重试。';b.hidden=false;}}
document.getElementById('cam').onclick=cam;
run();cam();
</script>
</body>
</html>
