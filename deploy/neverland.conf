server {
    listen 80;
    server_name ariari.art portal.ariari.art;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ariari.art portal.ariari.art;
    ssl_certificate /etc/letsencrypt/live/ariari.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ariari.art/privkey.pem;

    root /var/www/neverland/current/$host;
    add_header Cache-Control "no-store" always;
    location = / { try_files /index.html =404; }
    location = /index.html { return 302 https://ariari.art/$is_args$args; }
    location = /start.html { return 302 https://portal.ariari.art/$is_args$args; }
    location = /forum.html {
        if ($host = portal.ariari.art) { return 302 https://ariari.art$request_uri; }
        try_files $uri =404;
    }
    location ~ ^/(face|stage2|stage|jury|pass)\.html$ {
        if ($host = ariari.art) { return 302 https://portal.ariari.art$request_uri; }
        try_files $uri =404;
    }
    location / { try_files $uri =404; }
}
