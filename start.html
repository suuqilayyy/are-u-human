<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Verification Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased}
.phone{width:min(420px,100%);min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:var(--s-6) var(--s-5) var(--s-6)}
.head{margin-top:auto;text-align:center}
.logo{display:block;margin:0 auto var(--s-5);height:clamp(170px,28dvh,230px);width:auto}
/* dot-matrix title: her choice on 11-22, not code type */
h1{font-family:var(--font-display);font-weight:var(--fw-display);font-size:var(--fs-display);letter-spacing:.01em;line-height:var(--lh-tight);color:var(--accent);margin:0 0 var(--s-5)} /* taste-skill-ignore */
.lead{font-size:var(--fs-lead);line-height:1.35;color:var(--text);margin:0 0 var(--s-2);text-wrap:balance}
.meta{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-sub);margin:0;text-wrap:pretty}
.go{margin-top:auto}
.stag{opacity:0;transform:translateY(6px);animation:in var(--dur-slow) var(--ease-out) forwards}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stag{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<main class="phone">
  <div class="head">
    <img class="logo stag" src="assets/img/logo.png" alt="Human Verification Portal logo">
    <h1 class="stag" style="animation-delay:.06s">Human<br>Verification<br>Portal</h1>
    <p class="lead stag" style="animation-delay:.14s">We need to make sure you're human.</p>
    <p class="meta stag" style="animation-delay:.2s">Neverland is for humans only.</p>
  </div>
  <button class="btn btn-primary go stag" style="animation-delay:.35s" type="button" onclick="location.href='face.html'">Start verification</button>
</main>
<script src="flow.js"></script>
</body>
</html>
