<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage 1 Lab</title>
<!-- Stage 1 判决时刻：同一段眨眼测量，四种"把身体变成数字"的界面语言并排对比。素材是模拟的，不开摄像头。 -->
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--gray-100);font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;gap:var(--s-4) var(--s-6);align-items:center;padding:var(--s-3) var(--s-5);background:rgba(242,244,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:var(--fs-small)}
.bar h1{font-size:15px;font-weight:600;margin:0}
.seg{display:flex;align-items:center;gap:6px;color:var(--text-sub)}
.seg button{border:1px solid var(--gray-300);background:#fff;border-radius:var(--r-pill);padding:6px 12px;font:500 13px var(--font-body);color:var(--gray-700);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.play{margin-left:auto;border:0;background:var(--accent);color:#fff;border-radius:var(--r-pill);padding:8px 18px;font:500 14px var(--font-body);cursor:pointer}
.play:hover{background:var(--accent-hover)}
.grid{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:28px 16px 48px}
.col{display:flex;flex-direction:column;gap:10px;width:320px}
.cap{font-size:13px;color:var(--gray-700);line-height:1.45}
.cap b{color:var(--ink);font-weight:600}

/* ---- phone, C-minimal like face.html ---- */
.ph{position:relative;width:320px;height:660px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(16,38,47,.08);display:flex;flex-direction:column;align-items:center;padding:26px 20px 20px}
.view{position:relative;width:232px;aspect-ratio:1;flex:none;transition:transform .7s var(--ease-out),width .7s var(--ease-out)}
.ring{position:absolute;inset:0;overflow:visible;transition:opacity .25s}
.ring line{stroke:var(--gray-200);stroke-width:2.4;stroke-linecap:round}
.ring line.on{stroke:var(--accent);stroke-width:3.4}
.ring.think{animation:think .9s ease-in-out infinite}@keyframes think{50%{opacity:.35}}
.lens{position:absolute;inset:13%;border-radius:50%;overflow:hidden;background:var(--brand-100)}
.lens svg{width:100%;height:100%;display:block}
.lens .flash{position:absolute;inset:0;background:#fff;opacity:0}
.lens .flash.go{animation:flash .22s ease-out}@keyframes flash{0%{opacity:.45}100%{opacity:0}}
.tags{position:absolute;inset:0;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.view.shake{animation:shake .4s ease-out}

.msg{margin-top:22px;text-align:center;width:100%}
.line{font-size:25px;font-weight:400;letter-spacing:-.025em;line-height:1.15;transition:opacity .2s,transform .3s var(--ease-out)}
.sub{font-size:15px;color:var(--gray-700);line-height:1.45;margin-top:8px;min-height:22px;transition:opacity .2s .1s}
.msg.swap .line,.msg.swap .sub{opacity:0;transform:translateY(5px)}
.stage{width:100%;margin-top:18px;flex:1;position:relative}
.retry{width:100%;height:50px;border:0;border-radius:var(--r-pill);background:var(--accent);color:#fff;font:500 16px var(--font-body);opacity:0;transform:translateY(6px);transition:opacity .35s var(--ease-out),transform .35s var(--ease-out)}
.retry.in{opacity:1;transform:none}

/* A · axis */
.axis{position:relative;height:48px;opacity:0;transition:opacity .4s}
.axis.on{opacity:1}
.axis .ln{position:absolute;top:14px;left:0;right:0;height:1px;background:#d6d6d6}
.axis .hb{position:absolute;top:12px;height:5px;background:var(--brand-300)}
.axis .me{position:absolute;top:9px;width:11px;height:11px;border-radius:50%;background:var(--accent);transform:translateX(-50%);left:50%;transition:left .8s cubic-bezier(.2,.8,.2,1)}
.axis .lb,.axis .lh{position:absolute;top:26px;font-size:12px;white-space:nowrap;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.axis .lb{color:var(--accent)}.axis .lh{color:#8a8a8a}

/* B · tags pinned to the face */
.tag{position:absolute;font:800 10px/1 var(--font-display);letter-spacing:.02em;color:var(--ink);background:#fff;border:1px solid var(--ink);padding:3px 5px;white-space:nowrap;opacity:0;transform:scale(.8);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.tag.on{opacity:1;transform:none}
.tag.bad{background:var(--danger);border-color:var(--danger);color:#fff}
.tag::before{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--danger);}
.tag.l::before{right:-9px;top:50%;margin-top:-2.5px}.tag.r::before{left:-9px;top:50%;margin-top:-2.5px}
.verdictB{margin-top:6px;display:flex;justify-content:center;opacity:0;transform:translateY(8px);transition:all .45s var(--ease-out)}
.verdictB.on{opacity:1;transform:none}
.verdictB span{font:900 22px/1 var(--font-display);color:#fff;background:var(--ink);padding:8px 12px;letter-spacing:.02em}

/* C · histogram */
.hist{position:relative;height:120px;margin-top:28px;display:flex;align-items:flex-end;gap:3px;padding:0 2px}
.hist i{flex:1;background:var(--brand-200);height:0;transition:height .5s var(--ease-out)}
.hist i.you{background:var(--danger)}
.hist .pin{position:absolute;bottom:100%;transform:translate(-50%,4px);font-size:12px;color:var(--danger);white-space:nowrap;opacity:0;transition:opacity .3s,transform .4s var(--ease-out)}
.hist .pin.on{opacity:1;transform:translate(-50%,-4px)}
.hx{display:flex;justify-content:space-between;font-size:11px;color:#8a8a8a;margin-top:6px;font-variant-numeric:tabular-nums}
.hn{font-size:11px;color:#8a8a8a;margin-top:2px;text-align:center;opacity:0;transition:opacity .4s}.hn.on{opacity:1}

/* D · lab report */
.rep{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rep th{font-weight:500;color:#8a8a8a;font-size:11px;text-align:left;padding:0 0 6px;border-bottom:1px solid var(--ink)}
.rep th:nth-child(n+2),.rep td:nth-child(n+2){text-align:right}
.rep td{padding:8px 0;border-bottom:1px solid var(--line)}
.rep tr{opacity:0;transform:translateY(4px);transition:opacity .25s,transform .3s var(--ease-out)}
.rep tr.on,.rep thead tr{opacity:1;transform:none}
.rep .hi{color:var(--danger);font-weight:600}
.rep .ref{color:#8a8a8a}
.rep tr.total td{border-bottom:0;border-top:1px solid var(--ink);font-weight:600;padding-top:10px}

/* B lens shrink for C */
.ph.mini .view{width:150px}
.ph.mini .line{font-size:22px}
</style>
</head>
<body>
<div class="bar">
  <h1>Stage 1 · 判决时刻</h1>
  <div class="seg" id="scen">情况
    <button data-v="often" aria-pressed="true">眨得多</button>
    <button data-v="still">不眨</button>
    <button data-v="avg">正好平均</button>
  </div>
  <div class="seg" id="copy">文案
    <button data-v="0" aria-pressed="true">1 · 说人话</button>
    <button data-v="1">2 · 系统</button>
    <button data-v="2">3 · 百分位</button>
  </div>
  <button class="play" id="play">重放 ↻</button>
</div>

<div class="grid" id="grid"></div>

<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const VERSIONS=[
  {k:'A',name:'A · 分布轴',note:'现在 <b>face.html</b> 的做法。你是一条线上的一个点，人类是中间那一段。最克制。'},
  {k:'B',name:'B · 贴标签',note:'测量时数字一个个钉在你脸上，最后压成一个标签。"特征化"最直接：你的脸被写满。'},
  {k:'C',name:'C · 你在尾巴上',note:'镜头缩小，下面长出 3,127 个人类的分布，你是尾巴上那根红柱。"统计化"最直接。'},
  {k:'D',name:'D · 体检单',note:'借体检报告的样子：参考范围、↑ 箭头、红字。人人见过，不用解释就知道"你不正常"。'},
];
// blink times (s, inside the 5s scan) per scenario; rate = count*12 like face.html
const SCEN={often:[.8,2.2,3.9],still:[],avg:[2.1]};
const rateOf=s=>SCEN[s].length*12;
// copy variants: [line, sub]
const COPY={
  often:[["You blink too often.",r=>`${r} times a minute. Humans blink about 17.`],
         ["Blink rate out of range.",r=>`${r}/min · human range 12–22`],
         ["Unusual blinking.",r=>`You blink more than 97% of humans.`]],
  still:[["Your eyes are too still.",r=>`You didn't blink once. Humans blink about 17 times a minute.`],
         ["Blink rate out of range.",r=>`0/min · human range 12–22`],
         ["Unusual stillness.",r=>`You blink less than 99.6% of humans.`]],
  avg:[["Suspiciously normal.",r=>`${r} a minute, right on the human average. Agents aim for the average.`],
       ["Blink rate too typical.",r=>`${r}/min · σ 0.02 · flagged as synthetic`],
       ["Too average.",r=>`Closer to the mean than 99% of humans.`]],
};
let scen='often',copyI=0,run=0;

function faceSVG(){return `<svg viewBox="0 0 100 100" aria-hidden="true">
  <ellipse cx="50" cy="104" rx="38" ry="26" fill="#98bcc8"/>
  <rect x="42" y="66" width="16" height="14" fill="#a9c9d4"/>
  <ellipse cx="50" cy="48" rx="21" ry="26" fill="#b4d6e2"/>
  <g class="eyes" fill="#10262f"><ellipse class="eye" cx="42" cy="46" rx="2.6" ry="2.6"/><ellipse class="eye" cx="58" cy="46" rx="2.6" ry="2.6"/></g>
  <path d="M44 60 Q50 63 56 60" stroke="#2c6378" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>`}

function phone(v){
  const col=document.createElement('div');col.className='col';
  col.innerHTML=`<div class="ph" data-k="${v.k}">
    <div class="view"><svg class="ring" viewBox="0 0 200 200"></svg>
      <div class="lens">${faceSVG()}<div class="flash"></div></div><div class="tags"></div></div>
    <div class="msg"><div class="line"></div><div class="sub"></div></div>
    <div class="stage"></div>
    <button class="retry" type="button" tabindex="-1">Try again</button>
  </div><div class="cap"><b>${v.name}</b><br>${v.note}</div>`;
  const ring=col.querySelector('.ring');const N=72;
  ring.innerHTML=Array.from({length:N},(_,i)=>{const a=-Math.PI/2+i/N*2*Math.PI;return `<line x1="${100+88*Math.cos(a)}" y1="${100+88*Math.sin(a)}" x2="${100+98*Math.cos(a)}" y2="${100+98*Math.sin(a)}"/>`}).join('');
  return col;
}
const grid=document.getElementById('grid');
VERSIONS.forEach(v=>grid.appendChild(phone(v)));

function blink(ph){ph.querySelectorAll('.eye').forEach(e=>e.animate([{ry:2.6},{ry:.3},{ry:2.6}],{duration:180,easing:'ease-in-out'}));}
async function say(ph,line,sub){const m=ph.querySelector('.msg');m.classList.add('swap');await wait(160);m.querySelector('.line').textContent=line;m.querySelector('.sub').textContent=sub||'';m.classList.remove('swap');}
function sweep(ph,dur,live){const t=[...ph.querySelectorAll('.ring line')];return new Promise(res=>{const t0=performance.now();const f=now=>{if(!live())return res();const k=Math.min(1,(now-t0)/dur),n=Math.round(k*t.length);t.forEach((l,i)=>l.classList.toggle('on',i<n));k<1?requestAnimationFrame(f):res();};requestAnimationFrame(f);});}

// ---- version-specific verdict renderers ----
const R={
A(ph,rate){const st=ph.querySelector('.stage');
  st.innerHTML=`<div class="axis"><div class="ln"></div><div class="hb"></div><div class="me"></div><div class="lh">Humans</div><div class="lb"></div></div>`;
  const x=v=>Math.max(2,Math.min(98,v/60*100)),a=st.firstChild;
  a.querySelector('.hb').style.cssText=`left:${x(12)}%;width:${x(22)-x(12)}%`;a.querySelector('.lh').style.left=x(17)+'%';
  const far=Math.abs(rate-17)<14;a.querySelector('.lh').style.top=far?'-8px':'26px';
  requestAnimationFrame(()=>{a.classList.add('on');a.querySelector('.me').style.left=x(rate)+'%';const lb=a.querySelector('.lb');lb.style.left=x(rate)+'%';lb.textContent='You · '+rate;});
},
async B(ph,rate,live){const tg=ph.querySelector('.tags'),st=ph.querySelector('.stage');
  const flag=rate<12||rate>22;
  const T=[['l',4,96,`BLINK ${rate}/MIN ${rate>22?'↑':rate<12?'↓':'='}`,flag],['r',150,70,'GAZE 0.84'],['l',8,150,'SYM 0.91'],['r',150,128,'SMILE 3%'],['r',150,182,'TILT 4°']];
  for(const [side,x,y,t,bad] of T){if(!live())return;const d=document.createElement('div');d.className=`tag ${side}${bad?' bad':''}`;d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';tg.appendChild(d);requestAnimationFrame(()=>d.classList.add('on'));await wait(260);}
  await wait(500);if(!live())return;
  st.innerHTML=`<div class="verdictB"><span>NON-HUMAN 0.71</span></div>`;requestAnimationFrame(()=>st.firstChild.classList.add('on'));
},
async C(ph,rate,live){ph.classList.add('mini');const st=ph.querySelector('.stage');
  const bins=20,max=60,yi=Math.min(bins-1,Math.floor(rate/max*bins));
  const g=i=>{const c=(i+.5)/bins*max;return Math.exp(-((c-17)**2)/(2*5.5**2));};
  st.innerHTML=`<div class="hist">${Array.from({length:bins},(_,i)=>`<i${i===yi?' class="you"':''}></i>`).join('')}<div class="pin">You · ${rate}</div></div><div class="hx"><span>0</span><span>blinks / min</span><span>60</span></div><div class="hn">n = 3,127 humans</div>`;
  const bars=[...st.querySelectorAll('i')];
  await wait(350);
  bars.forEach((b,i)=>setTimeout(()=>{b.style.height=(i===yi?Math.max(6,g(i)*100):Math.max(1.5,g(i)*100))+'%'},i*30));
  st.querySelector('.hn').classList.add('on');
  await wait(bins*30+400);if(!live())return;
  const pin=st.querySelector('.pin');pin.style.left=((yi+.5)/bins*100)+'%';pin.classList.add('on');
},
async D(ph,rate,live){const st=ph.querySelector('.stage');
  const arrow=rate>22?'↑':rate<12?'↓':'';
  const rows=[['Blink rate',`${rate}${arrow?' '+arrow:''}`,'12–22',!!arrow],['Gaze hold','0.84 s','0.2–0.6',true],['Face symmetry','0.91','0.62–0.88',true],['Smile','3% ↓','5–40%',true]];
  st.innerHTML=`<table class="rep"><thead><tr><th>Item</th><th>Result</th><th>Ref.</th></tr></thead><tbody>${rows.map(([a,b,c,h])=>`<tr><td>${a}</td><td class="${h?'hi':''}">${b}${h&&!/[↑↓]/.test(b)?' ↑':''}</td><td class="ref">${c}</td></tr>`).join('')}<tr class="total"><td>Human</td><td class="hi">29% ↓</td><td class="ref">≥ 90%</td></tr></tbody></table>`;
  for(const tr of st.querySelectorAll('tbody tr')){if(!live())return;await wait(320);tr.classList.add('on');}
},
};

async function playOne(ph,id){
  const live=()=>id===run,k=ph.dataset.k,rate=rateOf(scen),[l,s]=COPY[scen][copyI];
  ph.classList.remove('mini');ph.querySelector('.stage').innerHTML='';ph.querySelector('.tags').innerHTML='';ph.querySelector('.retry').classList.remove('in');
  ph.querySelectorAll('.ring line').forEach(x=>x.classList.remove('on'));
  await say(ph,'Face scan complete.','');await wait(1100);if(!live())return;
  await say(ph,'Hold still.','');await wait(700);if(!live())return;
  await say(ph,'Scanning…','');
  const ts=SCEN[scen].map(t=>setTimeout(()=>{if(!live())return;blink(ph);
    if(k==='B'){const tg=ph.querySelector('.tags');const d=document.createElement('div');d.className='tag l on';d.style.cssText='left:66px;top:84px;transform:scale(.8);opacity:.9';d.textContent='+1';tg.appendChild(d);d.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-14px)'}],{duration:700,fill:'forwards'});setTimeout(()=>d.remove(),700);}
  },t*1000));
  await sweep(ph,5000,live);if(!live())return;
  const ring=ph.querySelector('.ring');ph.querySelector('.msg').classList.add('swap');ring.classList.add('think');await wait(1100);ring.classList.remove('think');if(!live())return;
  const v=ph.querySelector('.view');v.classList.remove('shake');void v.offsetWidth;v.classList.add('shake');
  await say(ph,l,s(rate));
  await R[k](ph,rate,live);if(!live())return;
  await wait(700);ph.querySelector('.retry').classList.add('in');
}
function playAll(){run++;const id=run;document.querySelectorAll('.ph').forEach(ph=>playOne(ph,id));}
// cheap idle blinking so the face feels alive
setInterval(()=>{if(Math.random()<.5)document.querySelectorAll('.ph').forEach(ph=>{if(!ph.querySelector('.ring line.on'))blink(ph)})},2600);

function seg(id,set){const g=document.getElementById(id);g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));set(b.dataset.v);playAll();});}
seg('scen',v=>scen=v);seg('copy',v=>copyI=+v);
document.getElementById('play').onclick=playAll;
playAll();
</script>
</body>
</html>
