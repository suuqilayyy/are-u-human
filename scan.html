<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate · Live Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0d10;color:#fff;font-family:Inter,-apple-system,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:contrast(1.05) saturate(.9)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.16;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .5s steps(4) infinite}
@keyframes grain{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.45))}
.hud{position:absolute;font-family:Doto,ui-monospace,monospace;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;line-height:1.6;color:var(--hud,#8ff);text-shadow:0 0 6px rgba(0,0,0,.4)}
.tl{left:20px;top:18px}.tr{right:20px;top:18px;text-align:right}.bl{left:20px;bottom:18px}
.sw{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
.sw i{width:22px;height:22px;display:block;border:1px solid rgba(255,255,255,.5)}
.start{position:absolute;inset:0;display:grid;place-items:center;background:#0b0d10}
.start div{text-align:center;max-width:360px;padding:0 16px}
.start h1{font:500 22px Inter,sans-serif;margin:0 0 8px}
.start p{color:#9aa0a8;font-size:13px;line-height:1.5;margin:0 0 18px}
.start button{height:42px;padding:0 22px;border:0;border-radius:99px;background:#fff;color:#111;font:500 14px Inter,sans-serif;cursor:pointer}
.start .err{color:#f88;margin-top:12px;font-size:12px}
</style>
</head>
<body>
<div class="stage">
  <video id="v" playsinline muted></video>
  <canvas id="c"></canvas>
  <div class="grain"></div><div class="vig"></div>
  <div class="hud tl" id="tl">Humanity scan<br>Subject · Visitor #0038<br>Loading models…</div>
  <div class="hud tr" id="tr">Scene palette<div class="sw" id="sw"></div></div>
  <div class="hud bl" id="bl"></div>
  <div class="start" id="start"><div>
    <h1>Gate needs to see you.</h1>
    <p>Your camera feed is analysed on this device and never uploaded.</p>
    <button id="go" type="button">Allow camera</button>
    <div class="err" id="err"></div>
  </div></div>
</div>

<script type="module">
import {FilesetResolver,FaceLandmarker,ObjectDetector} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const v=document.getElementById('v'),cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const sample=document.createElement('canvas');sample.width=48;sample.height=27;
const sctx=sample.getContext('2d',{willReadFrequently:true});

let face=null,obj=null,ready=false;
const W=()=>cv.width,H=()=>cv.height;
function size(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;}
addEventListener('resize',size);size();

(async()=>{
  try{
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    face=await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},runningMode:"VIDEO",numFaces:1,outputFaceBlendshapes:true});
    obj=await ObjectDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",delegate:"GPU"},runningMode:"VIDEO",scoreThreshold:.4,maxResults:6});
    ready=true;
  }catch(e){$('err').textContent='Model load failed: '+e.message;}
})();

$('go').onclick=async()=>{
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    v.srcObject=s;await v.play();$('start').remove();requestAnimationFrame(loop);
  }catch(e){$('err').textContent='Camera unavailable: '+e.message+' (needs https or localhost)';}
};

// map a point in video space to screen space (object-fit:cover + mirror)
function mapper(){
  const vw=v.videoWidth,vh=v.videoHeight,s=Math.max(W()/vw,H()/vh),ox=(W()-vw*s)/2,oy=(H()-vh*s)/2;
  return (x,y)=>[W()-(x*vw*s+ox),y*vh*s+oy];
}

// HUD colour = complement of the scene's dominant hue
let hud=[140,255,255],palette=[];
function readScene(){
  sctx.drawImage(v,0,0,sample.width,sample.height);
  const d=sctx.getImageData(0,0,sample.width,sample.height).data,b={};
  let r=0,g=0,bl=0,n=0;
  for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];bl+=d[i+2];n++;
    const k=(d[i]>>5)+','+(d[i+1]>>5)+','+(d[i+2]>>5);(b[k]=b[k]||{c:0,r:0,g:0,b:0});b[k].c++;b[k].r+=d[i];b[k].g+=d[i+1];b[k].b+=d[i+2];}
  palette=Object.values(b).sort((a,b)=>b.c-a.c).slice(0,5).map(x=>[x.r/x.c|0,x.g/x.c|0,x.b/x.c|0]);
  r/=n;g/=n;bl/=n;
  const mx=Math.max(r,g,bl),mn=Math.min(r,g,bl);
  let t=[255-r,255-g,255-bl];const tm=Math.max(...t),tn=Math.min(...t);
  t=t.map(c=>tn===tm?200:Math.round(150+105*(c-tn)/(tm-tn)));     // keep it bright
  hud=hud.map((c,i)=>c+(t[i]-c)*.08);
  document.documentElement.style.setProperty('--hud',`rgb(${hud.map(Math.round)})`);
  $('sw').innerHTML=palette.map(p=>`<i style="background:rgb(${p})"></i>`).join('');
}
const hex=p=>'#'+p.map(c=>c.toString(16).padStart(2,'0')).join('');

// drifting markers: each one hops between targets so positions never settle
const LM=[33,133,159,145,362,263,386,374,468,473,70,300,105,334,168,6];
const marks=Array.from({length:10},(_,i)=>({x:Math.random(),y:Math.random(),tx:Math.random(),ty:Math.random(),lm:i<LM.length?LM[i]:-1,t:Math.random()*3,s:6+Math.random()*6}));
let blinks=0,wasClosed=false,blinkTimes=[],wave=new Array(160).fill(0),objs=[],frame=0,lastT=-1,start=performance.now();

function bracket(x,y,w,h,col){
  const L=Math.min(w,h)*.22;ctx.strokeStyle=col;ctx.lineWidth=2*devicePixelRatio;
  ctx.beginPath();
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([a,b,sx,sy])=>{ctx.moveTo(a+sx*L,b);ctx.lineTo(a,b);ctx.lineTo(a,b+sy*L);});
  ctx.stroke();
}
function hexagon(cx,cy,r,col){
  ctx.strokeStyle=col;ctx.lineWidth=1.6*devicePixelRatio;ctx.beginPath();
  for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;ctx[i?'lineTo':'moveTo'](cx+r*1.25*Math.cos(a),cy+r*.8*Math.sin(a));}
  ctx.closePath();ctx.stroke();
}
function box(x,y,s,col,alpha){
  ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=1.4*devicePixelRatio;ctx.strokeRect(x-s/2,y-s/2,s,s);
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,s*.14,0,7);ctx.fill();ctx.globalAlpha=1;
}

function loop(now){
  requestAnimationFrame(loop);
  if(v.readyState<2)return;
  frame++;
  if(frame%6===0)readScene();
  const map=mapper(),col=`rgb(${hud.map(Math.round)})`,dpr=devicePixelRatio;
  ctx.clearRect(0,0,W(),H());

  let fr=null,bs={};
  if(ready&&v.currentTime!==lastT){
    lastT=v.currentTime;
    fr=face.detectForVideo(v,now);
    if(frame%4===0)objs=obj.detectForVideo(v,now).detections||[];
  }
  const pts=fr&&fr.faceLandmarks&&fr.faceLandmarks[0];
  if(fr&&fr.faceBlendshapes&&fr.faceBlendshapes[0])fr.faceBlendshapes[0].categories.forEach(c=>bs[c.categoryName]=c.score);

  // object brackets hidden for now; names still listed in the bottom-left readout

  // face reticle
  if(pts){
    let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
    pts.forEach(p=>{const [x,y]=map(p.x,p.y);mnx=Math.min(mnx,x);mxx=Math.max(mxx,x);mny=Math.min(mny,y);mxy=Math.max(mxy,y);});
    const pad=(mxx-mnx)*.12,fx=mnx-pad,fy=mny-pad,fw=mxx-mnx+2*pad,fh=mxy-mny+2*pad;
    // faint square markers circling the face along its (slightly enlarged) outline
    const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
    const [cx,cy]=map(pts[168].x,pts[168].y);
    const ring=OVAL.map(i=>{const [x,y]=map(pts[i].x,pts[i].y);return [cx+(x-cx)*1.22,cy+(y-cy)*1.22];});
    const along=t=>{t=((t%1)+1)%1;const f=t*ring.length,i=f|0,k=f-i,p=ring[i],q=ring[(i+1)%ring.length];return [p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k];};
    const N=12,spin=now/16000;
    for(let i=0;i<N;i++){
      const ph=i/N+spin+.015*Math.sin(now/900+i*1.7);
      const [x,y]=along(ph),wob=1+.04*Math.sin(now/700+i);
      box(cx+(x-cx)*wob,cy+(y-cy)*wob,(8+3*Math.sin(i*2.3))*dpr,col,.22+.22*(.5+.5*Math.sin(now/500+i*1.3)));
    }

    // blink tracking
    const bl=((bs.eyeBlinkLeft||0)+(bs.eyeBlinkRight||0))/2;
    if(bl>.5&&!wasClosed){wasClosed=true;blinks++;blinkTimes.push(now);}
    if(bl<.3)wasClosed=false;
    wave.push(bl);wave.shift();
  }else{wave.push(0);wave.shift();}

  // drifting markers: half chase face landmarks, half wander; all keep re-targeting
  marks.forEach(m=>{
    m.t-=1/60;
    if(m.t<=0){m.t=.6+Math.random()*2.2;
      if(false){const p=pts[LM[(Math.random()*LM.length)|0]];m.tx=p.x+(Math.random()-.5)*.03;m.ty=p.y+(Math.random()-.5)*.03;}
      else{m.tx=.05+Math.random()*.9;m.ty=.05+Math.random()*.85;}}
    m.x+=(m.tx-m.x)*.06;m.y+=(m.ty-m.y)*.06;
    const [x,y]=map(m.x,m.y);
    box(x,y,(m.s+2)*dpr,col,.18+.14*Math.sin(now/300+m.s));
  });

  // waveform (blink signal) along the bottom, like the reference's spectrum
  ctx.strokeStyle=col;ctx.lineWidth=1.4*dpr;ctx.beginPath();
  const base=H()-40*dpr,x0=W()*.22,x1=W()*.78;
  wave.forEach((w,i)=>{const x=x0+(x1-x0)*i/(wave.length-1),y=base-w*70*dpr-(Math.random()*4*dpr);ctx[i?'lineTo':'moveTo'](x,y);});
  ctx.stroke();ctx.globalAlpha=.4;ctx.beginPath();ctx.moveTo(0,base+2*dpr);ctx.lineTo(W(),base+2*dpr);ctx.stroke();ctx.globalAlpha=1;

  // readouts
  blinkTimes=blinkTimes.filter(t=>now-t<60000);
  const mins=Math.min(1,(now-start)/60000),rate=mins>.08?Math.round(blinkTimes.length/Math.max(mins,.08)):'--';
  const smile=((bs.mouthSmileLeft||0)+(bs.mouthSmileRight||0))/2,sym=1-Math.abs((bs.mouthSmileLeft||0)-(bs.mouthSmileRight||0));
  $('tl').innerHTML=`Humanity scan<br>Subject · Visitor #0038<br>${pts?'Face locked':'Searching for face…'}<br>Blinks ${blinks} · ${rate}/min<br>Smile ${(smile*100|0)}% · sym ${(sym*100|0)}%<br>Jaw ${((bs.jawOpen||0)*100|0)}%`;
  const names=objs.map(d=>d.categories[0]&&d.categories[0].categoryName).filter(n=>n&&n!=='person');
  $('bl').innerHTML=`Objects · ${names.length?names.join(' / '):'none'}<br>Dominant · ${palette[0]?hex(palette[0]):'--'}`;
}
</script>
</body>
</html>
