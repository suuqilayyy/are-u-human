<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/img/logo.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-i18n="stage.title">Gate · Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gate.css">
<style>
.ph{margin-top:60px;text-align:center}
.box{margin:36px auto 0;width:min(300px,78vw);aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;
  font-family:Doto,monospace;font-weight:800;font-size:13px;letter-spacing:.12em;color:var(--sub)}
.note{margin-top:28px;font-size:13px;color:var(--sub);line-height:1.5;text-align:center}
</style>
<script src="i18n/messages.js"></script>
<script src="i18n.js"></script>
</head>
<body>
<iframe class="behind" data-background-page="index.html" tabindex="-1" aria-hidden="true"></iframe>
<div class="veil"></div>
<div class="phone">
  <div class="top"><span><b data-i18n="stage.gate">Gate</b> · <span id="name"></span></span><span id="n"></span></div>
  <div class="box" id="box" data-i18n="stage.design">TO BE DESIGNED</div>
  <div class="ph">
    <div class="step" id="feel"></div>
    <div class="line" id="title"></div>
    <div class="note" id="note"></div>
  </div>
  <div class="btns"><button class="pri" type="button" id="next"></button></div>
</div>
<script>i18n.apply(document);</script>
<script src="flow.js"></script>
<script>
const s=new URLSearchParams(location.search).get('s')||'2';
const D={
  '2':{name:t('stage.2.name'),feel:t('stage.2.feel'),title:t('stage.2.title'),note:t('stage.2.note'),next:t('stage.2.next')},
  '3':{name:t('stage.3.name'),feel:t('stage.3.feel'),title:t('stage.3.title'),note:t('stage.3.note'),next:t('stage.3.next')}
}[s];
const $=id=>document.getElementById(id);
document.title=t('stage.pageTitle', {stage: D.name});
$('name').textContent=D.name;$('n').textContent=t('stage.progress', {stage: D.name});
$('feel').textContent=D.feel;$('title').textContent=D.title;$('note').textContent=D.note;
$('next').textContent=D.next;$('next').onclick=()=>flowNext();
</script>
</body>
</html>
