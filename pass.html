<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gate · Human Pass</title>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gate.css">
<style>
.pass{margin-top:40px;border-radius:24px;padding:22px;aspect-ratio:1.58;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.9);box-shadow:0 16px 40px rgba(20,30,60,.15)}
.pass .k{font-family:Doto,monospace;font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--sub)}
.pass .id{font-family:Doto,monospace;font-weight:800;font-size:26px;letter-spacing:.04em}
.pass .row{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px}
.basis{margin-top:24px;text-align:center}
</style>
</head>
<body>
<iframe class="behind" src="index.html" tabindex="-1" aria-hidden="true"></iframe>
<div class="veil"></div>
<div class="phone">
    <div class="pass" aria-label="Human Pass">
    <div class="k">NEVERLAND · HUMAN PASS</div>
    <div class="id">VISITOR #0047</div>
    <div class="row"><div><div class="k">VALID FOR</div>24 hours</div><div><div class="k">CAMERA</div>Must stay on</div></div>
  </div>
  <div class="basis">
    <div class="line">Verified by 3 humans who vouched for you.</div>
  </div>
  <div class="btns"><button class="pri" type="button" onclick="flowNext()">Enter Neverland</button></div>
</div>
<script src="flow.js"></script>
</body>
</html>
